<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Edit Employee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Edit Employee</h1>
    <form class="card form-grid" method="post">
        <input name="name" value="{{ employee.name }}" required>
        <input name="email" type="email" value="{{ employee.email }}" required>
        <input name="department" value="{{ employee.department }}" required>
        <input name="salary" type="number" min="0" step="0.01" value="{{ employee.salary }}" required>
        <button type="submit">Save Changes</button>
        <a href="{{ url_for('index') }}">Cancel</a>
    </form>
</div>
</body>
</html>
